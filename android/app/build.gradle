plugins {
    id 'com.android.application'
}

android {
    namespace "com.bookbarber.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.bookbarber.app"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 111
        versionName "0.0.111"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // kotlinOptions is now handled by the top-level kotlin extension in AGP 9.x
}

kotlin {
    jvmToolchain(25)
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Kotlin stdlib is included by the plugin, but we can keep it for clarity with a specific version if needed
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidxLifecycleVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    // OneSignal SDK 5.x
    implementation 'com.onesignal:OneSignal:5.1.38'

    // Firebase BOM (Automanage versions)
    implementation platform('com.google.firebase:firebase-bom:34.6.0')

    // Firebase Analytics + Messaging (FCM)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // Google Play Services Location (for GPS Link)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}

//
// 🚀 MOST IMPORTANT LINE
// This MUST be at the bottom for FCM token to work.
//
apply plugin: 'com.google.gms.google-services'

apply from: 'capacitor.build.gradle'
