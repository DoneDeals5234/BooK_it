server {
    server_name donedeals.shop *.donedeals.shop;

    root /var/www/bookit;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/donedeals.shop-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donedeals.shop-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name donedeals.shop *.donedeals.shop;
    return 301 https://$host$request_uri;
}
