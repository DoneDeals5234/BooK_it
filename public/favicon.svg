<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Red background square with rounded corners (like the BOOK IT logo) -->
  <rect width="100" height="100" rx="18" ry="18" fill="#dc2626"/>
  
  <!-- White calendar icon lines -->
  <rect x="20" y="35" width="60" height="45" rx="6" ry="6" fill="white" opacity="0.15"/>
  
  <!-- BOOK text (top) -->
  <text
    x="50"
    y="48"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="24"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >BOOK</text>

  <!-- IT text (bottom) -->
  <text
    x="50"
    y="72"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="24"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >IT</text>
  
  <!-- Small checkmark dot -->
  <circle cx="78" cy="22" r="10" fill="#22c55e"/>
  <text x="78" y="27" font-family="Arial" font-weight="900" font-size="14" fill="white" text-anchor="middle">✓</text>
</svg>